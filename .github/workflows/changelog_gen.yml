name: Auto-Changelog Generator

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '.github/workflows/**'
# Das hier macht den Workflow wiederverwendbar für all deine anderen Repos!
  workflow_call:
  # Manueller Testlauf. paths-ignore gilt nur für push, nicht für workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-changelog:
    # github.repository gehört bei workflow_call zum Aufrufer, nicht zu Dusa/verteiler.
    # In diesem Repository (push und workflow_dispatch) läuft der Job nicht:
    # hier soll kein Changelog entstehen, das später mitverteilt werden könnte.
    if: ${{ github.repository != 'Dusa/verteiler' }}
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      # Setzt die Zeitzone für alle Befehle auf Wien (berücksichtigt Sommer- und Winterzeit automatisch)
      TZ: Europe/Vienna
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Verteiler Repo
        uses: actions/checkout@v4
        with:
          repository: Dusa/verteiler
          ref: main
          path: _verteiler_temp

      - name: Copy central files
        run: |
          # Eine Liste für find und rsync. Jeder Name gilt in jedem Verzeichnis.
          # .verteiler-manifest entsteht erst im Ziel und darf nicht aus dem Verteiler kommen.
          # global_settings.php und global_config.php gehören dem Ziel: dort setzt der
          # Workflow nur die Versionskonstanten. Sie werden nicht verteilt.
          exclude_names=(
            .git
            .github
            README.md
            CHANGELOG.md
            CHANGELOG.html
            msg.txt
            temp.md
            entry_line.txt
            verteiler_files.txt
            global_settings.php
            global_config.php
            .verteiler-manifest
          )

          find_args=()
          rsync_args=()
          for name in "${exclude_names[@]}"; do
            find_args+=( -not -path "*/${name}/*" -not -name "$name" )
            rsync_args+=( --exclude="$name" )
          done

          MANIFEST=.verteiler-manifest

          is_excluded_path() {
            local path="$1"
            local base name
            base=$(basename -- "$path")
            for name in "${exclude_names[@]}"; do
              if [ "$path" = "$name" ] || [ "$base" = "$name" ]; then
                return 0
              fi
              case "$path" in
                "$name"/*|*/"$name"/*)
                  return 0
                  ;;
              esac
            done
            return 1
          }

          # Hartes Verbot, auch wenn ein altes Manifest den Pfad nennt.
          # Dateinamen gelten in jedem Verzeichnis. .git und .github gelten als
          # Verzeichnisname überall im Baum.
          is_protected() {
            local path="$1"
            local base
            base=$(basename -- "$path")
            case "$path" in
              .git|.git/*|.github|.github/*|*/.git|*/.git/*|*/.github|*/.github/*)
                return 0
                ;;
            esac
            case "$base" in
              README.md|CHANGELOG.md|CHANGELOG.html|global_settings.php|global_config.php|.verteiler-manifest)
                return 0
                ;;
            esac
            return 1
          }

          unsafe_path() {
            local path="$1"
            case "$path" in
              ""|/*|..|../*|*/..|*/../*|*$'\n'*)
                return 0
                ;;
            esac
            return 1
          }

          cleanup_empty_parents() {
            local dir
            dir=$(dirname -- "$1")
            while [ "$dir" != "." ] && [ -n "$dir" ]; do
              case "$dir" in
                .git|.git/*|.github|.github/*|*/.git|*/.git/*|*/.github|*/.github/*)
                  break
                  ;;
              esac
              if [ ! -e "$dir" ]; then
                # git rm entfernt ein leer gewordenes Verzeichnis oft selbst.
                echo "Leeres Verzeichnis entfernt: $dir"
                dir=$(dirname -- "$dir")
                continue
              fi
              if [ ! -d "$dir" ] || [ -n "$(find "$dir" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                break
              fi
              rmdir -- "$dir" || break
              echo "Leeres Verzeichnis entfernt: $dir"
              dir=$(dirname -- "$dir")
            done
          }

          old_manifest=$(mktemp)
          paths_file=$(mktemp)
          new_manifest=$(mktemp)
          unsorted=$(mktemp)
          trap 'rm -f "$old_manifest" "$paths_file" "$new_manifest" "$unsorted"; rm -rf _verteiler_temp' EXIT

          # Vor dem Kopieren sichern. Ein späteres rsync darf diese Datei nicht ersetzen.
          if [ -f "$MANIFEST" ]; then
            sed 's/\r$//' "$MANIFEST" | sort -u > "$old_manifest"
            had_manifest=1
          else
            had_manifest=0
            : > "$old_manifest"
          fi

          (
            cd _verteiler_temp || exit 1
            find . -type f "${find_args[@]}" -print0 | sort -z > "$paths_file"
          )

          : > "$unsorted"
          while IFS= read -r -d '' path; do
            rel=${path#./}
            case "$rel" in
              *$'\n'*)
                echo "Pfad enthält einen Zeilenumbruch und wird nicht verteilt." >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$rel" >> "$unsorted"
          done < "$paths_file"
          sort -u -o "$new_manifest" "$unsorted"

          while IFS= read -r path || [ -n "$path" ]; do
            [ -z "$path" ] && continue
            if is_excluded_path "$path"; then
              echo "Ausschlussliste hat den Pfad nicht gefiltert: $path" >&2
              exit 1
            fi
          done < "$new_manifest"

          # Kein --delete: Dateien, die nur im Ziel liegen, bleiben.
          # -m lässt leere Ordner weg, die nur ausgeschlossene Dateien enthalten.
          # Wegfall im Verteiler räumt danach ausschließlich das Manifest auf.
          rsync -avm "${rsync_args[@]}" _verteiler_temp/ ./
          rm -rf _verteiler_temp

          mv "$new_manifest" "$MANIFEST"

          removed=0
          if [ "$had_manifest" -eq 0 ]; then
            echo "Kein bisheriges .verteiler-manifest. Es wird nichts gelöscht."
          else
            while IFS= read -r path || [ -n "$path" ]; do
              [ -z "$path" ] && continue
              if unsafe_path "$path"; then
                echo "Unsicherer Pfad, nicht entfernt: $path"
                continue
              fi
              if is_protected "$path"; then
                echo "Geschützt, nicht entfernt: $path"
                continue
              fi
              if [ -d "$path" ] && [ ! -L "$path" ]; then
                echo "Verzeichnis im Manifest, nicht entfernt: $path"
                continue
              fi
              present=0
              if [ -e "$path" ] || [ -L "$path" ]; then
                present=1
              elif git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
                present=1
              fi
              if [ "$present" -eq 0 ]; then
                echo "Bereits fehlend, übersprungen: $path"
                continue
              fi
              git rm -q -f --ignore-unmatch -- "$path"
              if [ -e "$path" ] || [ -L "$path" ]; then
                echo "Nicht im Index, Datei bleibt liegen: $path"
                continue
              fi
              echo "Entfernt: $path"
              removed=$((removed + 1))
              cleanup_empty_parents "$path"
            done < <(comm -23 "$old_manifest" "$MANIFEST")
            if [ "$removed" -eq 0 ]; then
              echo "Keine Dateien entfernt."
            fi
          fi

          count=$(wc -l < "$MANIFEST" | tr -d ' ')
          echo "Manifest geschrieben: ${MANIFEST} (${count} Dateien)."

      # --- TEIL 1: Betreffzeilen der Commits dieses Pushes ---
      - name: Get Commit Messages and Date
        id: vars
        env:
          # Bei workflow_dispatch ist before leer. Beim ersten Push eines neuen Branches ist es die Null-SHA.
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          # Nur die Betreffzeile (%s). Rumpf und Co-authored-by bleiben draußen.
          # Leeres before (manueller Lauf) und die Null-SHA fallen auf die letzten drei Commits zurück.
          if [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && [ -n "$EVENT_BEFORE" ]; then
            git log "$EVENT_BEFORE".."$EVENT_SHA" --no-merges --pretty=%s > msg.txt || git log -3 --no-merges --pretty=%s > msg.txt
          else
            git log -3 --no-merges --pretty=%s > msg.txt
          fi

          filtered=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              "chore: auto-update changelog"*)
                continue
                ;;
              "")
                continue
                ;;
            esac
            printf '%s\n' "$line"
          done < msg.txt > "$filtered"
          mv "$filtered" msg.txt

          DATE=$(date +"%d.%m.%Y")
          BUILD=$(date +"%Y%m%d_%H%M")
          {
            echo "date=$DATE"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"

      # --- TEIL 3: MD und HTML generieren ---
      - name: Update CHANGELOG.md
        env:
          DATE: ${{ steps.vars.outputs.date }}
          BUILD: ${{ steps.vars.outputs.build }}
        run: |
          ensure_bom() {
            if [ -f CHANGELOG.md ] && [ "$(head -c 3 CHANGELOG.md)" != $'\xEF\xBB\xBF' ]; then
              { printf '\xEF\xBB\xBF'; cat CHANGELOG.md; } > temp.md
              mv temp.md CHANGELOG.md
            fi
          }

          : > entry_line.txt
          while IFS= read -r SUBJECT || [ -n "$SUBJECT" ]; do
            [ -z "$SUBJECT" ] && continue
            CAT_EXTRACT=$(printf '%s\n' "$SUBJECT" | grep -oE '\[(NEU|GEÄNDERT|ENTFERNT|BEHOBEN)\]' | head -n 1 || true)
            CAT=$(printf '%s' "$CAT_EXTRACT" | tr -d '[]')
            if [ -z "$CAT" ]; then
              CAT="GEÄNDERT"
            fi
            CLEAN_TEXT=$(printf '%s\n' "$SUBJECT" | sed -E 's/^\[[^]]+\][[:space:]]*//')
            printf '* **%s** (Build %s): %s\n' "$CAT" "$BUILD" "$CLEAN_TEXT" >> entry_line.txt
          done < msg.txt

          if [ ! -s entry_line.txt ]; then
            echo "Keine Changelog-Einträge."
            if [ ! -f CHANGELOG.md ]; then
              printf '# Changelog\n' > CHANGELOG.md
              ensure_bom
            fi
          else
            if [ ! -f CHANGELOG.md ]; then
              printf '# Changelog\n' > CHANGELOG.md
            fi

            # Einträge stehen zeilenweise in der Datei, damit awk Backslashes nicht als Escape liest.
            if grep -F -q -e "## $DATE" CHANGELOG.md; then
              awk -v date="## $DATE" '
                $0 == date {
                  print
                  while ((getline line < "entry_line.txt") > 0) print line
                  close("entry_line.txt")
                  next
                }
                { print }
              ' CHANGELOG.md > temp.md && mv temp.md CHANGELOG.md
            else
              {
                echo "# Changelog"
                echo
                echo "## $DATE"
                cat entry_line.txt
                echo
                tail -n +2 CHANGELOG.md
              } > temp.md && mv temp.md CHANGELOG.md
            fi
            ensure_bom
          fi
          rm -f entry_line.txt msg.txt temp.md

      - name: Generate CHANGELOG.html
        run: |
          # BOM nur am Dateianfang. marked bekommt die Markdown-Datei ohne BOM,
          # sonst landet das BOM mitten im HTML.
          printf '\xEF\xBB\xBF' > CHANGELOG.html
          cat << 'EOF' >> CHANGELOG.html
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Changelog</title>
            <style>
              :root { --bg: #ffffff; --text: #333333; --border: #eaecef; --link: #0366d6; --link-hover: #005cc5; --icon-hover: #f6f8fa; }
              @media (prefers-color-scheme: dark) {
                :root { --bg: #0d1117; --text: #c9d1d9; --border: #30363d; --link: #58a6ff; --link-hover: #79c0ff; --icon-hover: #21262d; }
              }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; background-color: var(--bg); color: var(--text); }
              h1 { border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 30px; }
              details { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
              summary { cursor: pointer; color: var(--link); font-size: 1.5em; font-weight: bold; outline: none; padding: 5px 0; display: flex; align-items: center; }
              summary:hover { color: var(--link-hover); }
              .copy-link { margin-left: 10px; cursor: pointer; font-size: 0.6em; color: var(--text); opacity: 0; transition: all 0.2s; background: none; border: none; padding: 4px; border-radius: 4px; }
              summary:hover .copy-link { opacity: 1; }
              .copy-link:hover { background-color: var(--icon-hover); color: var(--link); }
              li { margin-bottom: 8px; }
            </style>
          </head>
          <body>
          EOF
          
          # Marked direkt ausführen (ohne globale Admin-Rechte zu benötigen)
          if [ "$(head -c 3 CHANGELOG.md)" = $'\xEF\xBB\xBF' ]; then
            tail -c +4 CHANGELOG.md | npx --yes marked >> CHANGELOG.html
          else
            npx --yes marked < CHANGELOG.md >> CHANGELOG.html
          fi
          
          cat << 'EOF' >> CHANGELOG.html
          <script>
            document.addEventListener("DOMContentLoaded", () => {
              const headers = document.querySelectorAll("h2");
              
              headers.forEach(h2 => {
                const dateStr = h2.innerText.trim();
                const details = document.createElement("details");
                const summary = document.createElement("summary");
                
                const titleText = document.createElement("span");
                titleText.textContent = dateStr;
                
                const linkIcon = document.createElement("span");
                linkIcon.className = "copy-link";
                linkIcon.innerHTML = "🔗";
                linkIcon.title = "Link zu diesem Eintrag kopieren";
                
                linkIcon.onclick = (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  
                  const url = window.location.href.split('#')[0] + "#" + dateStr;
                  const tempInput = document.createElement("input");
                  tempInput.value = url;
                  document.body.appendChild(tempInput);
                  tempInput.select();
                  document.execCommand("copy");
                  document.body.removeChild(tempInput);
                  
                  linkIcon.innerHTML = "✅";
                  setTimeout(() => { linkIcon.innerHTML = "🔗"; }, 2000);
                };
                
                summary.appendChild(titleText);
                summary.appendChild(linkIcon);
                details.id = dateStr;
                
                h2.parentNode.insertBefore(details, h2);
                details.appendChild(summary);
                
                let nextNode = h2.nextSibling;
                while (nextNode && nextNode.nodeName !== "H2") {
                  let current = nextNode;
                  nextNode = nextNode.nextSibling;
                  details.appendChild(current);
                }
                
                h2.remove();
              });

              function handleHash() {
                const hash = decodeURIComponent(window.location.hash.substring(1));
                const allDetails = document.querySelectorAll("details");
                
                if (!hash) {
                  allDetails.forEach((d, index) => {
                    d.open = (index === 0);
                  });
                  return;
                }
                
                allDetails.forEach(d => {
                  if (d.id === hash) {
                    d.open = true;
                    setTimeout(() => d.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
                  } else {
                    d.open = false; 
                  }
                });
              }

              handleHash();
              window.addEventListener("hashchange", handleHash);
            });
          </script>
          </body>
          </html>
          EOF

      # --- TEIL 3.5: Globale Konfigurationsdatei updaten ---
      - name: Update Global Configuration
        env:
          BUILD_VAL: ${{ steps.vars.outputs.build }}
        run: |
          DATE_VAL=$(date +"%Y-%m-%d")
          
          CONF_FILE=""
          if [ -f "global_settings.php" ]; then
            CONF_FILE="global_settings.php"
          elif [ -f "global_config.php" ]; then
            CONF_FILE="global_config.php"
          fi
          
          if [ -n "$CONF_FILE" ]; then
            echo "Konfigurationsdatei $CONF_FILE gefunden. Aktualisiere Version..."
            
            # APP_VERSION_DATE prüfen und ersetzen oder in Zeile 2 (nach <?php) hinzufügen
            if grep -q "define_if_not_set('APP_VERSION_DATE'" "$CONF_FILE"; then
              sed -i "s/define_if_not_set('APP_VERSION_DATE'.*/define_if_not_set('APP_VERSION_DATE', '$DATE_VAL');/" "$CONF_FILE"
            else
              sed -i "2i define_if_not_set('APP_VERSION_DATE', '$DATE_VAL');" "$CONF_FILE"
            fi
            
            # APP_VERSION_BUILD prüfen und ersetzen oder in Zeile 2 hinzufügen
            if grep -q "define_if_not_set('APP_VERSION_BUILD'" "$CONF_FILE"; then
              sed -i "s/define_if_not_set('APP_VERSION_BUILD'.*/define_if_not_set('APP_VERSION_BUILD', '$BUILD_VAL');/" "$CONF_FILE"
            else
              sed -i "2i define_if_not_set('APP_VERSION_BUILD', '$BUILD_VAL');" "$CONF_FILE"
            fi
          else
            echo "Keine global_settings.php oder global_config.php gefunden. Überspringe diesen Schritt."
          fi

      # --- TEIL 4: Alles zusammen pushen ---
      - name: Commit and Push
        run: |
          git config user.name "NudlDudl Bot"
          git config user.email "nudldudl.bot@users.noreply.github.com"
          
          git add -- CHANGELOG.md CHANGELOG.html
          if [ -f "global_settings.php" ]; then git add -- global_settings.php; fi
          if [ -f "global_config.php" ]; then git add -- global_config.php; fi

          # Manifest und genau die zuletzt verteilten Dateien. Löschungen sind schon per git rm gestaged.
          if [ -f ".verteiler-manifest" ]; then
            while IFS= read -r file || [ -n "$file" ]; do
              [ -z "$file" ] && continue
              git add -- "$file"
            done < .verteiler-manifest
            git add -- .verteiler-manifest
          fi
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update changelog and sync files [skip ci]"
            git push
          else
            echo "Keine Änderungen zum Committen gefunden."
          fi
