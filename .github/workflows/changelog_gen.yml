name: Auto-Changelog Generator

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '.github/workflows/**'
# Das hier macht den Workflow wiederverwendbar für all deine anderen Repos!
  workflow_call:

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      # Setzt die Zeitzone für alle Befehle auf Wien (berücksichtigt Sommer- und Winterzeit automatisch)
      TZ: Europe/Vienna
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Verteiler Repo
        uses: actions/checkout@v4
        with:
          repository: Dusa/verteiler
          ref: main
          path: _verteiler_temp

      - name: Copy central files
        run: |
          # .editorconfig aus dem Verteiler ins aktuelle Repo kopieren
          cp _verteiler_temp/.editorconfig ./.editorconfig
          # Den temporären Ordner wieder löschen, damit er nicht stört
          rm -rf _verteiler_temp

      # --- TEIL 1: ALLE Commit-Nachrichten dieses Pushes holen ---
      - name: Get Commit Messages and Date
        id: vars
        run: |
          # Prüfen ob Event-Daten vorhanden sind, um ALLE Commits des Pushes zu erfassen
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            git log ${{ github.event.before }}..${{ github.sha }} --no-merges --pretty=%B > msg.txt || git log -3 --no-merges --pretty=%B > msg.txt
          else
            git log -3 --no-merges --pretty=%B > msg.txt
          fi
          
          DATE=$(date +"%d.%m.%Y")
          BUILD=$(date +"%Y%m%d_%H%M")
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      # --- TEIL 2: KI Übersetzung und Formatierung ---
      - name: AI Translation via GitHub Copilot / Models
        id: ai
        run: |
          JSON_PAYLOAD=$(jq -n \
            --arg msg "$(cat msg.txt)" \
            '{
              "model": "gpt-4o",
              "messages": [
                {
                  "role": "system", 
                  "content": "Du bist ein technischer Redakteur. Übersetze die bereitgestellten Commit-Nachrichten ins Deutsche. Ignoriere dabei automatische Git-Texte wie Merge branch oder Merge pull request. Fasse alle inhaltlichen Änderungen ALLER übergebenen Commits (auch Listen und mehrere Punkte) in einem einzigen, flüssigen Satz zusammen. Verwende keine Aufzählungszeichen und absolut keine Zeilenumbrüche! Gib NUR diese eine Zeile zurück. Beginne zwingend mit einer dieser Kategorien: [NEU], [GEÄNDERT], [ENTFERNT], [BEHOBEN]."
                },
                {
                  "role": "user", 
                  "content": $msg
                }
              ]
            }')
          
          RESPONSE=$(curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" || true)
            
          USER_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
          
          if [ "$USER_TEXT" == "null" ] || [ -z "$USER_TEXT" ]; then 
            # Absicherung gegen Pipe-Fails (Exit Code 1 bei grep), falls es keine reinen Merge-Commits gibt
            CLEAN_FALLBACK=$(grep -v -i "^Merge" msg.txt || true)
            # Falls die Datei leer gefiltert wurde, nimm alles
            if [ -z "$CLEAN_FALLBACK" ]; then CLEAN_FALLBACK=$(cat msg.txt); fi
            
            CLEAN_FALLBACK=$(echo "$CLEAN_FALLBACK" | tr '\n' ' ' | tr -s ' ' | cut -c1-300)
            USER_TEXT="[GEÄNDERT] $CLEAN_FALLBACK..."
          fi
          
          # Sicherheitsnetz: Garantiert alle Zeilenumbrüche sicher entfernen
          USER_TEXT=$(printf '%s' "$USER_TEXT" | tr '\n' ' ' | tr -s ' ' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          
          echo "user_text=$USER_TEXT" >> $GITHUB_OUTPUT

      # --- TEIL 3: MD und HTML generieren ---
      - name: Update CHANGELOG.md
        env:
          DATE: ${{ steps.vars.outputs.date }}
          BUILD: ${{ steps.vars.outputs.build }}
          ENTRY: ${{ steps.ai.outputs.user_text }}
        run: |
          # Sicherstellen, dass grep nicht abstürzt, wenn es das Tag nicht findet
          CAT_EXTRACT=$(echo "$ENTRY" | grep -oE "\[(NEU|GEÄNDERT|ENTFERNT|BEHOBEN)\]" || true)
          CAT=$(echo "$CAT_EXTRACT" | tr -d '[]')
          
          if [ -z "$CAT" ]; then
            CAT="GEÄNDERT"
          fi
          
          CLEAN_TEXT=$(echo "$ENTRY" | sed -E 's/^\[[^]]+\][[:space:]]*//')
          
          # Build-Nummer direkt neben der Kategorie einfügen
          NEW_LINE="* **$CAT** (Build $BUILD): $CLEAN_TEXT"
          
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
          fi

          if grep -q "## $DATE" CHANGELOG.md; then
            awk -v date="## $DATE" -v newline="$NEW_LINE" '
              $0 == date { print; print newline; next }
              { print }
            ' CHANGELOG.md > temp.md && mv temp.md CHANGELOG.md
          else
            echo "# Changelog" > temp.md
            echo "" >> temp.md
            echo "## $DATE" >> temp.md
            echo "$NEW_LINE" >> temp.md
            echo "" >> temp.md
            tail -n +2 CHANGELOG.md >> temp.md
            mv temp.md CHANGELOG.md
          fi

      - name: Generate CHANGELOG.html
        run: |
          cat << 'EOF' > CHANGELOG.html
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Changelog</title>
            <style>
              :root { --bg: #ffffff; --text: #333333; --border: #eaecef; --link: #0366d6; --link-hover: #005cc5; --icon-hover: #f6f8fa; }
              @media (prefers-color-scheme: dark) {
                :root { --bg: #0d1117; --text: #c9d1d9; --border: #30363d; --link: #58a6ff; --link-hover: #79c0ff; --icon-hover: #21262d; }
              }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; background-color: var(--bg); color: var(--text); }
              h1 { border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 30px; }
              details { margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
              summary { cursor: pointer; color: var(--link); font-size: 1.5em; font-weight: bold; outline: none; padding: 5px 0; display: flex; align-items: center; }
              summary:hover { color: var(--link-hover); }
              .copy-link { margin-left: 10px; cursor: pointer; font-size: 0.6em; color: var(--text); opacity: 0; transition: all 0.2s; background: none; border: none; padding: 4px; border-radius: 4px; }
              summary:hover .copy-link { opacity: 1; }
              .copy-link:hover { background-color: var(--icon-hover); color: var(--link); }
              li { margin-bottom: 8px; }
            </style>
          </head>
          <body>
          EOF
          
          # Marked direkt ausführen (ohne globale Admin-Rechte zu benötigen)
          npx --yes marked < CHANGELOG.md >> CHANGELOG.html
          
          cat << 'EOF' >> CHANGELOG.html
          <script>
            document.addEventListener("DOMContentLoaded", () => {
              const headers = document.querySelectorAll("h2");
              
              headers.forEach(h2 => {
                const dateStr = h2.innerText.trim();
                const details = document.createElement("details");
                const summary = document.createElement("summary");
                
                const titleText = document.createElement("span");
                titleText.textContent = dateStr;
                
                const linkIcon = document.createElement("span");
                linkIcon.className = "copy-link";
                linkIcon.innerHTML = "🔗";
                linkIcon.title = "Link zu diesem Eintrag kopieren";
                
                linkIcon.onclick = (e) => {
                  e.preventDefault();
                  e.stopPropagation();
                  
                  const url = window.location.href.split('#')[0] + "#" + dateStr;
                  const tempInput = document.createElement("input");
                  tempInput.value = url;
                  document.body.appendChild(tempInput);
                  tempInput.select();
                  document.execCommand("copy");
                  document.body.removeChild(tempInput);
                  
                  linkIcon.innerHTML = "✅";
                  setTimeout(() => { linkIcon.innerHTML = "🔗"; }, 2000);
                };
                
                summary.appendChild(titleText);
                summary.appendChild(linkIcon);
                details.id = dateStr;
                
                h2.parentNode.insertBefore(details, h2);
                details.appendChild(summary);
                
                let nextNode = h2.nextSibling;
                while (nextNode && nextNode.nodeName !== "H2") {
                  let current = nextNode;
                  nextNode = nextNode.nextSibling;
                  details.appendChild(current);
                }
                
                h2.remove();
              });

              function handleHash() {
                const hash = decodeURIComponent(window.location.hash.substring(1));
                const allDetails = document.querySelectorAll("details");
                
                if (!hash) {
                  allDetails.forEach((d, index) => {
                    d.open = (index === 0);
                  });
                  return;
                }
                
                allDetails.forEach(d => {
                  if (d.id === hash) {
                    d.open = true;
                    setTimeout(() => d.scrolltoView({ behavior: "smooth", block: "start" }), 100);
                  } else {
                    d.open = false; 
                  }
                });
              }

              handleHash();
              window.addEventListener("hashchange", handleHash);
            });
          </script>
          </body>
          </html>
          EOF

      # --- TEIL 3.5: Globale Konfigurationsdatei updaten ---
      - name: Update Global Configuration
        env:
          BUILD_VAL: ${{ steps.vars.outputs.build }}
        run: |
          DATE_VAL=$(date +"%Y-%m-%d")
          
          CONF_FILE=""
          if [ -f "global_settings.php" ]; then
            CONF_FILE="global_settings.php"
          elif [ -f "global_config.php" ]; then
            CONF_FILE="global_config.php"
          fi
          
          if [ -n "$CONF_FILE" ]; then
            echo "Konfigurationsdatei $CONF_FILE gefunden. Aktualisiere Version..."
            
            # APP_VERSION_DATE prüfen und ersetzen oder in Zeile 2 (nach <?php) hinzufügen
            if grep -q "define_if_not_set('APP_VERSION_DATE'" "$CONF_FILE"; then
              sed -i "s/define_if_not_set('APP_VERSION_DATE'.*/define_if_not_set('APP_VERSION_DATE', '$DATE_VAL');/" "$CONF_FILE"
            else
              sed -i "2i define_if_not_set('APP_VERSION_DATE', '$DATE_VAL');" "$CONF_FILE"
            fi
            
            # APP_VERSION_BUILD prüfen und ersetzen oder in Zeile 2 hinzufügen
            if grep -q "define_if_not_set('APP_VERSION_BUILD'" "$CONF_FILE"; then
              sed -i "s/define_if_not_set('APP_VERSION_BUILD'.*/define_if_not_set('APP_VERSION_BUILD', '$BUILD_VAL');/" "$CONF_FILE"
            else
              sed -i "2i define_if_not_set('APP_VERSION_BUILD', '$BUILD_VAL');" "$CONF_FILE"
            fi
          else
            echo "Keine global_settings.php oder global_config.php gefunden. Überspringe diesen Schritt."
          fi

      # --- TEIL 4: Alles zusammen pushen ---
      - name: Commit and Push
        run: |
          git config user.name "NudlDudl Bot"
          git config user.email "nudldudl.bot@users.noreply.github.com"
          
          git add CHANGELOG.md CHANGELOG.html .editorconfig
          if [ -f "global_settings.php" ]; then git add global_settings.php; fi
          if [ -f "global_config.php" ]; then git add global_config.php; fi
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update changelog and sync files [skip ci]"
            git push
          else
            echo "Keine Änderungen zum Committen gefunden."
          fi
